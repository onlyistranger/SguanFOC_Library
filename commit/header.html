<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Prevent Theme Flash: Immediately apply saved or system theme -->
<script>
  (function() {
    try {
      var saved = localStorage.getItem('sguanfoc-docs-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved ? saved : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>

<!-- Mermaid.js: Fully offline, direct SVG rendering without sandbox iframe -->
<script src="assets/mermaid.min.js"></script>

<style>

<script>
// Mermaid dynamic theme initialization
function renderMermaidGraphs(theme) {
  if (typeof mermaid === "undefined") return;
  try {
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'loose',
      theme: theme === 'dark' ? 'dark' : 'default'
    });
    document.querySelectorAll(".mermaid").forEach(function(el) {
      if (el.dataset.mermaidCode) {
        el.removeAttribute("data-processed");
        el.innerHTML = el.dataset.mermaidCode;
      }
    });
    mermaid.run();
  } catch (e) {
    console.warn("Mermaid execution catch:", e);
  }
}

document.addEventListener("DOMContentLoaded", function() {
  var currentTheme = document.documentElement.getAttribute('data-theme') || 'light';

  // 1. Setup Theme Toggle Button
  var toggleBtn = document.getElementById("themeToggleBtn");
  function updateToggleBtn(theme) {
    if (!toggleBtn) return;
    var icon = toggleBtn.querySelector(".theme-icon");
    var text = toggleBtn.querySelector(".theme-text");
    if (theme === "dark") {
      if (icon) icon.textContent = "🌙";
      if (text) text.textContent = "深色";
      toggleBtn.title = "当前为深色模式，点击切换为浅色";
    } else {
      if (icon) icon.textContent = "☀️";
      if (text) text.textContent = "浅色";
      toggleBtn.title = "当前为浅色模式，点击切换为深色";
    }
  }
  updateToggleBtn(currentTheme);

  if (toggleBtn) {
    toggleBtn.addEventListener("click", function() {
      var activeTheme = document.documentElement.getAttribute('data-theme') || 'light';
      var newTheme = activeTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      try {
        localStorage.setItem('sguanfoc-docs-theme', newTheme);
      } catch (e) {}
      updateToggleBtn(newTheme);
      renderMermaidGraphs(newTheme);
    });
  }

  // 2. Transform mermaid code blocks to direct divs and store raw code for dynamic re-theme
  document.querySelectorAll("pre.mermaid, pre.sourceCode.mermaid, pre > code.language-mermaid").forEach(function(el) {
    var pre = el.tagName === "CODE" ? el.parentElement : el;
    if (!pre || pre.dataset.mermaidProcessed) return;
    pre.dataset.mermaidProcessed = "true";
    var graphDef = pre.textContent;
    var div = document.createElement("div");
    div.className = "mermaid";
    div.dataset.mermaidCode = graphDef;
    div.textContent = graphDef;
    pre.replaceWith(div);
  });

  renderMermaidGraphs(currentTheme);

  // 3. Transform GitHub Alert Blockquotes into styled Callout boxes
  document.querySelectorAll("blockquote").forEach(function(bq) {
    var html = bq.innerHTML;
    var alerts = [
      { tag: "[!NOTE]", class: "alert-note", title: "说明 / NOTE", icon: "ℹ️" },
      { tag: "[!TIP]", class: "alert-tip", title: "实战建议 / TIP", icon: "💡" },
      { tag: "[!IMPORTANT]", class: "alert-important", title: "关键重点 / IMPORTANT", icon: "📌" },
      { tag: "[!WARNING]", class: "alert-warning", title: "注意事项 / WARNING", icon: "⚠️" },
      { tag: "[!CAUTION]", class: "alert-caution", title: "避坑警示 / CAUTION", icon: "🛑" }
    ];
    for (var i = 0; i < alerts.length; i++) {
      var a = alerts[i];
      if (html.indexOf(a.tag) !== -1) {
        bq.className = "alert-box " + a.class;
        bq.innerHTML = html.replace(a.tag, '<div class="alert-title">' + a.icon + ' ' + a.title + '</div>');
        break;
      }
    }
  });

  // 4. Add Copy Button to Pre Code blocks
  document.querySelectorAll("pre").forEach(function(pre) {
    if (pre.classList.contains("mermaid")) return;
    var btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.innerText = "复制";
    btn.onclick = function() {
      navigator.clipboard.writeText(pre.innerText.replace("复制", "").trim()).then(function() {
        btn.innerText = "已复制";
        setTimeout(function() { btn.innerText = "复制"; }, 2000);
      });
    };
    pre.appendChild(btn);
  });

  // 5. Automatically rewrite internal .md links to .html for browser navigation
  document.querySelectorAll("a").forEach(function(a) {
    var href = a.getAttribute("href");
    if (href && !href.startsWith("http") && !href.startsWith("#") && !href.startsWith("mailto:")) {
      if (href.endsWith(".md")) {
        a.setAttribute("href", href.replace(/\.md$/, ".html"));
      } else if (href.indexOf(".md#") !== -1) {
        a.setAttribute("href", href.replace(/\.md#/, ".html#"));
      } else if (href.startsWith("../") && !href.startsWith("../../")) {
        a.setAttribute("href", "../" + href);
      }
    }
  });

  // 6. Highlight active navbar link
  var currentFile = window.location.pathname.split("/").pop() || "foc_code_analysis.html";
  document.querySelectorAll(".nav-links a").forEach(function(link) {
    var target = link.getAttribute("href");
    if (target === currentFile || (currentFile === "" && target === "foc_code_analysis.html") || (currentFile === "index.html" && target === "foc_code_analysis.html")) {
      link.classList.add("active");
    }
  });

  // 7. Wrap TOC and Content into structured container if not already
  var body = document.body;
  var toc = document.getElementById("TOC");
  if (toc) {
    var container = document.createElement("div");
    container.className = "doc-container";
    
    var content = document.createElement("main");
    content.className = "doc-content";

    var children = Array.from(body.children);
    children.forEach(function(child) {
      if (child.id === "TOC" || child.className === "top-navbar" || child.tagName === "SCRIPT" || child.tagName === "STYLE" || child.tagName === "LINK") return;
      content.appendChild(child);
    });

    container.appendChild(toc);
    container.appendChild(content);
    body.appendChild(container);
  }
});
</script>
